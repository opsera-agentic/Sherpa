name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Guard — no tracked node_modules
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
      - name: Fail if node_modules is committed
        run: |
          set -euo pipefail
          if git ls-files | grep -q '^node_modules/'; then
            echo '::error::Tracked files under node_modules/ were found. Remove them from git history.'
            git ls-files | grep '^node_modules/' || true
            exit 1
          fi
          echo 'OK: no tracked node_modules/ paths'

  build:
    name: Build
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  lint:
    name: Lint
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Test (${{ matrix.os }})
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (capture native module build log)
        shell: bash
        run: npm ci --foreground-scripts 2>&1 | tee install.log
      - name: Verify better-sqlite3 native module
        shell: bash
        run: |
          if grep -q 'gyp info' install.log; then
            echo '::warning::better-sqlite3 was compiled from source (node-gyp fallback) — no prebuilt binary matched this platform/Node version.'
          else
            echo 'better-sqlite3 installed from prebuilt binary (no node-gyp fallback)'
          fi
          node -e "const db = new (require('better-sqlite3'))(':memory:'); db.exec('CREATE TABLE t (x)'); db.close(); console.log('better-sqlite3 native module loads and works')"
      - run: npm run build
      - run: npm run test

  semgrep:
    name: Security scan — Semgrep
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 8
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v6
      - run: semgrep ci --config auto

  gitleaks:
    name: Security scan — Gitleaks
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # The gitleaks-action requires a GITLEAKS_LICENSE secret for org repos;
      # the CLI is license-free and scans the full git history the same way.
      - name: Download gitleaks CLI
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
      - name: Scan git history for secrets
        run: ./gitleaks git --redact --no-banner --verbose

  publish:
    name: Publish tarball (npm pack)
    needs: [build, lint, test, semgrep, gitleaks]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: mkdir -p artifacts && npm pack -w @sherpa/cli-app --pack-destination artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: sherpa-cli-tgz
          path: artifacts/*.tgz
